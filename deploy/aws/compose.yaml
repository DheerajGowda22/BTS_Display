# Used on the EC2 server (copied to /opt/hiring-pulse by update.sh).
# app.env holds STAFF_PIN (from SSM, mode 600); .env holds SITE_ADDRESS for Caddy.
services:
  app:
    build: ./app
    restart: unless-stopped
    env_file: ./app.env
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - /srv/hiring-pulse/data:/data   # pulse.db lives here, on the encrypted EBS disk
    expose: ["3000"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # HTTPS certificates
      - caddy_config:/config
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

volumes:
  caddy_data: {}
  caddy_config: {}
